<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" role="img" aria-labelledby="title desc">
  <title id="title">Ball House logo</title>
  <desc id="desc">A minimal stacked Ball House wordmark with a roof-shaped A and a basketball-shaped O.</desc>

  <g fill="#071226" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">
    <text x="75" y="105">B</text>
    <text x="248" y="105">LL</text>
    <text x="39" y="226">H</text>
    <text x="219" y="226">USE</text>
  </g>

  <!-- The A is reduced to an architectural roof, two uprights, and one crossbar. -->
  <g fill="none" stroke="#F36C21" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M145 100 L190 27 L235 100" />
    <path d="M164 70 H216" />
  </g>

  <!-- The O is a basketball: one circle with only three essential seam strokes. -->
  <g transform="translate(165 187)">
    <circle r="44" fill="#F36C21" />
    <path d="M0 -44 V44 M-43 0 H43 M-31 -31 C-7 -15 7 15 31 31" fill="none" stroke="#071226" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
